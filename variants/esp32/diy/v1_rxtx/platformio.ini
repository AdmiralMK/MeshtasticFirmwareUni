[env:meshtastic-diy-v1-rxtx-ru-tst]
extends = esp32_base
board = esp32doit-devkit-v1
board_check = true
lib_ignore = BLE
build_flags =
  ${esp32_base.build_flags}
  -D DIY_V1
  -D EBYTE_E22
  ;-D PRIVATE_HW
  -D OLED_RU
  -I variants/esp32/diy/v1_rxtx
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  ;-D DEBUG_HEAP=1

